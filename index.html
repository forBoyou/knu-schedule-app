<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розклад КНУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
     <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 10px; /* Зменшили зовнішні відступи */
            text-align: center;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.2s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Компактний заголовок дня */
        #scheduleTitle {
            margin: 10px 0 15px 0;
            font-size: 22px;
        }

        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 6px auto;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            width: 100%;
            max-width: 280px;
            display: block;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }
        button:active { background-color: #2563eb; transform: scale(0.98); }
        .btn-secondary { background-color: #9ca3af; box-shadow: 0 2px 4px rgba(156, 163, 175, 0.3); margin-top: 15px; }
        .btn-secondary:active { background-color: #6b7280; }

        #scheduleContent { text-align: left; }

        /* УЛЬТРА-КОМПАКТНІ КАРТКИ */
        .lesson-card {
            background-color: #ffffff;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .card-header {
            background-color: #f9fafb;
            text-align: center;
            padding: 6px 10px; /* Зменшили висоту шапки */
            border-bottom: 1px solid #f3f4f6;
        }
        .lesson-number {
            font-size: 12px;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 2px;
        }
        .lesson-time {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
        }

        .card-body {
            padding: 10px 14px; /* Зменшили відступи всередині */
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
        }
        .subject-title {
            font-size: 14px;
            font-weight: 700;
            color: #111827;
            line-height: 1.2;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .badge-l { background-color: #e0f2fe; color: #0369a1; }  
        .badge-pr { background-color: #dcfce7; color: #15803d; } 
        .badge-lab { background-color: #ffedd5; color: #c2410c; } 
        .badge-s { background-color: #f3e8ff; color: #7e22ce; }  

        .room-line {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 3px;
        }
        .teacher-line {
            font-size: 13px;
            color: #9ca3af;
        }
        
        .other-line {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
            font-style: italic;
        }

        .group-label {
            font-size: 12px;
            font-weight: 700;
            color: #6366f1;
            background-color: #e0e7ff;
            padding: 3px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
            margin-top: 6px;
        }

        /* Заготовка стилів для майбутніх іконок */
        .custom-icon {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 5px;
            opacity: 0.7;
        }
    </style>
    </style>
</head>
<body>

    <div id="courseScreen" class="screen active">
        <h1>Розклад Соціології 📚</h1>
        <p style="color: #6b7280; margin-bottom: 24px;">Обери свій курс, щоб дізнатися розклад.</p>
        <button id="btnCourse1">1 курс</button>
        <button id="btnCourse2">2 курс</button>
    </div>

    <div id="daysScreen" class="screen">
        <h1 id="daysTitle">Курс 🎓</h1>
        <p style="color: #6b7280; margin-bottom: 20px;">Обери день тижня:</p>
        
        <button class="dayBtn" data-day="Понеділок">Понеділок</button>
        <button class="dayBtn" data-day="Вівторок">Вівторок</button>
        <button class="dayBtn" data-day="Середа">Середа</button>
        <button class="dayBtn" data-day="Четвер">Четвер</button>
        <button class="dayBtn" data-day="П'ятниця">П'ятниця</button>
        
        <button id="btnBackToCourse" class="btn-secondary">🔙 Назад до курсів</button>
    </div>

    <div id="scheduleScreen" class="screen">
        <h1 id="scheduleTitle">Розклад</h1>
        <div id="scheduleContent">⏳ Завантаження...</div>
        <button id="btnBackToDays" class="btn-secondary">🔙 Інший день</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let selectedCourse = "1";

        const courseScreen = document.getElementById('courseScreen');
        const daysScreen = document.getElementById('daysScreen');
        const scheduleScreen = document.getElementById('scheduleScreen');

        const btnCourse1 = document.getElementById('btnCourse1');
        const btnCourse2 = document.getElementById('btnCourse2');
        const btnBackToCourse = document.getElementById('btnBackToCourse');
        const btnBackToDays = document.getElementById('btnBackToDays');
        const dayButtons = document.querySelectorAll('.dayBtn');

        const daysTitle = document.getElementById('daysTitle');
        const scheduleTitle = document.getElementById('scheduleTitle');
        const scheduleContent = document.getElementById('scheduleContent');

        btnCourse1.addEventListener('click', () => {
            selectedCourse = "1";
            daysTitle.innerText = "1 курс 🎓";
            courseScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        btnCourse2.addEventListener('click', () => {
            selectedCourse = "2";
            daysTitle.innerText = "2 курс 🎓";
            courseScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        btnBackToCourse.addEventListener('click', () => {
            daysScreen.classList.remove('active');
            courseScreen.classList.add('active');
        });

        btnBackToDays.addEventListener('click', () => {
            scheduleScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        dayButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const selectedDay = e.target.getAttribute('data-day');
                daysScreen.classList.remove('active');
                scheduleScreen.classList.add('active');
                scheduleTitle.innerText = selectedDay;
                scheduleContent.innerHTML = "<div style='text-align:center;'>⏳ Отримання даних із сервера...</div>";
                
                fetchSchedule(selectedCourse, selectedDay);
            });
        });

        // РОЗУМНИЙ ПАРСЕР ТЕКСТУ
        function formatLessonBlock(blockText) {
            let lines = blockText.split('<br>').map(l => l.trim()).filter(l => l);
            if (lines.length === 0) return "";
            
            let subject = lines[0];
            let teacher = "";
            let room = "";
            let other = [];
            
            // Сортуємо рядки по суті (Шукаємо ауд. і викладача)
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i];
                if (line.toLowerCase().includes('ауд')) {
                    room = line;
                } else if (line.match(/(доц\.|проф\.|асп\.|викл\.|ас\.)/i) || line.includes('👨‍🏫')) {
                    teacher = line;
                } else {
                    other.push(line);
                }
            }
            
            // Витягуємо тип пари в кольоровий бейдж
            let typeBadge = "";
            let typeMatch = subject.match(/\s*\((Л\vert{}ПР\vert{}С\vert{}ЛАБ)\)/i);
            if (typeMatch) {
                let t = typeMatch[1].toUpperCase();
                let bClass = 'badge-l';
                let tName = 'Лекція';
                
                if (t === 'ПР') { bClass = 'badge-pr'; tName = 'Практика'; }
                else if (t === 'ЛАБ') { bClass = 'badge-lab'; tName = 'Лабораторна'; }
                else if (t === 'С') { bClass = 'badge-s'; tName = 'Семінар'; }
                
                typeBadge = `<span class="badge ${bClass}">${tName}</span>`;
                subject = subject.replace(typeMatch[0], '').trim();
            }
            
            // Прибираємо КАПС (Робимо першу велику, інші маленькі)
            if (subject === subject.toUpperCase() && subject.match(/[А-ЯІЇЄҐ]/)) {
                subject = subject.charAt(0).toUpperCase() + subject.slice(1).toLowerCase();
            }
            
            // Збираємо блок у правильному порядку (Аудиторія вище викладача)
            let html = `<div class="lesson-header">
                            <span class="subject-title">${subject}</span>
                            ${typeBadge}
                        </div>`;
                        
            if (room) {
                html += `<div class="room-line">🚪 ${room.replace('🚪', '').trim()}</div>`;
            }
            if (teacher) {
                html += `<div class="teacher-line">👨‍🏫 ${teacher.replace('👨‍🏫', '').trim()}</div>`;
            }
            if (other.length > 0) {
                html += `<div class="other-line">${other.join('<br>')}</div>`;
            }
            
            return html;
        }

        // Парсер для розбивки підгруп
        function parseLessonText(rawText) {
            let text = rawText.replace(/\n/g, '<br>');
            
            if (text.includes('Група 1:')) {
                let parts = text.split(/(Група \d+:)/i).filter(p => p.trim() !== "");
                let html = "";
                parts.forEach(part => {
                    if (part.match(/Група \d+:/i)) {
                        html += `<div class="group-label">${part}</div>`;
                    } else {
                        html += formatLessonBlock(part);
                    }
                });
                return html;
            }
            return formatLessonBlock(text);
        }

        async function fetchSchedule(course, day) {
            const url = `https://Bohdanyof.pythonanywhere.com/api/schedule?t=${new Date().getTime()}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Помилка сервера');
                
                const data = await response.json();
                const dayKey = day.toUpperCase(); 

                if (!data[course] || !data[course][dayKey] || Object.keys(data[course][dayKey]).length === 0) {
                    scheduleContent.innerHTML = `<div style="text-align:center; font-size: 17px; color: #4b5563; margin-top: 40px;">У ${day} пар немає! 🎉</div>`;
                    return;
                }

                const daySchedule = data[course][dayKey];
                let htmlContent = '';
                
                // Слова для нумерації
                const numberWords = ["Перша пара", "Друга пара", "Третя пара", "Четверта пара", "П'ята пара", "Шоста пара"];
                let lessonIndex = 0;
                
                for (let time in daySchedule) {
                    let parsedContent = parseLessonText(daySchedule[time]);
                    let lessonNumText = numberWords[lessonIndex] || `${lessonIndex + 1}-а пара`;
                    lessonIndex++;
                    
                    htmlContent += `
                        <div class="lesson-card">
                            <div class="card-header">
                                <div class="lesson-number">${lessonNumText}</div>
                                <div class="lesson-time">⏰ ${time}</div>
                            </div>
                            <div class="card-body">
                                ${parsedContent}
                            </div>
                        </div>
                    `;
                }
                
                scheduleContent.innerHTML = htmlContent;

            } catch (error) {
                console.error(error);
                scheduleContent.innerHTML = "<div style='text-align:center; color: #ef4444;'>Упс, помилка при з'єднанні з сервером. Спробуйте пізніше.</div>";
            }
        }
    </script>
</body>
</html>
