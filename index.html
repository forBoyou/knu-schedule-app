<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розклад КНУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        /* Скрываем все экраны по умолчанию */
        .screen {
            display: none; 
        }
        /* Показываем только активный экран */
        .active {
            display: block; 
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin: 8px 0;
            width: 100%;
            cursor: pointer;
        }
        /* Стили для заблокированной кнопки */
        button:disabled {
            background-color: var(--tg-theme-hint-color, #999999);
            cursor: not-allowed;
            opacity: 0.5;
        }
        /* Стили для кнопки "Назад" */
        .btn-secondary {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            margin-top: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 15px; color: var(--tg-theme-hint-color, #999999); margin-bottom: 25px; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Выбор курса -->
    <div id="courseScreen" class="screen active">
        <h1>Розклад Соціології 📚</h1>
        <p>Привіт! Обери свій курс, щоб дізнатися розклад.</p>
        
        <button id="btnCourse1">1 курс</button>
        <button id="btnCourse2" disabled>2 курс (у розробці)</button>
    </div>

    <!-- ЭКРАН 2: Дни недели (для 1 курса) -->
    <div id="daysScreen" class="screen">
        <h1>1 курс 🎓</h1>
        <p>Обери день тижня:</p>
        
        <button class="dayBtn" data-day="Понеділок">Понеділок</button>
        <button class="dayBtn" data-day="Вівторок">Вівторок</button>
        <button class="dayBtn" data-day="Середа">Середа</button>
        <button class="dayBtn" data-day="Четвер">Четвер</button>
        <button class="dayBtn" data-day="П'ятниця">П'ятниця</button>
        
        <button id="btnBack" class="btn-secondary">🔙 Назад</button>
    </div>
<script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Находим экраны
        const courseScreen = document.getElementById('courseScreen');
        const daysScreen = document.getElementById('daysScreen');

        // Находим кнопки навигации
        const btnCourse1 = document.getElementById('btnCourse1');
        const btnBack = document.getElementById('btnBack');
        const dayButtons = document.querySelectorAll('.dayBtn');

        // ПЕРЕХОД: с Экрана 1 на Экран 2
        btnCourse1.addEventListener('click', () => {
            courseScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        // ПЕРЕХОД: Назад
        btnBack.addEventListener('click', () => {
            daysScreen.classList.remove('active');
            courseScreen.classList.add('active');
        });

        // ОБРАБОТКА ДНЕЙ НЕДЕЛИ (связь с ботом)
        dayButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const selectedDay = e.target.getAttribute('data-day');
                
                const dayCodes = {
                    "Понеділок": "mon",
                    "Вівторок": "tue",
                    "Середа": "wed",
                    "Четвер": "thu",
                    "П'ятниця": "fri"
                };
                let code = dayCodes[selectedDay];
                
                // ВАЖЛИВО: Запиши сюди юзернейм твого бота без @
                let botUsername = "knu_schedulebot"; 
                
                // Відкриваємо бота з прихованою командою
                tg.openTelegramLink(`https://t.me/${botUsername}?start=c1_${code}`);
            });
        });
    </script>
           
</body>
</html>
