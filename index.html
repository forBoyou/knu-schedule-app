<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розклад КНУ</title>
    
    <!-- ТА САМАЯ МАГИЧЕСКАЯ СТРОЧКА: Подключаем библиотеку Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Делаем так, чтобы цвета приложения автоматически подстраивались под тему пользователя (светлую/темную) */
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Розклад Соціології 📚</h1>
    <p>Привіт! Це твій новий міні-додаток.</p>
    <button id="mainBtn">Обрати курс</button>

    <script>
        // Сообщаем Телеграму, что приложение готово к работе
        let tg = window.Telegram.WebApp;
        
        // Разворачиваем окно на всю высоту экрана при открытии
        tg.expand(); 

        // Добавляем тестовую реакцию на кнопку
        document.getElementById("mainBtn").addEventListener("click", function() {
            tg.showAlert("Кнопка працює! Скоро тут буде вибір курсу.");
        });
    </script>
</body>
</html>
