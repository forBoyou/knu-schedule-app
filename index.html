<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розклад КНУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .screen { display: none; }
        .active { display: block; }
        
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin: 8px 0;
            width: 100%;
            cursor: pointer;
        }
        .btn-secondary {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            margin-top: 20px;
        }
        
        #scheduleContent {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: left;
            font-size: 15px;
            white-space: pre-line;
        }

        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 15px; color: var(--tg-theme-hint-color, #999999); margin-bottom: 25px; }
    </style>
</head>
<body>

    <!-- ЕКРАН 1: Вибір курсу -->
    <div id="courseScreen" class="screen active">
        <h1>Розклад Соціології 📚</h1>
        <p>Привіт! Обери свій курс, щоб дізнатися розклад.</p>
        <button id="btnCourse1">1 курс</button>
        <button id="btnCourse2">2 курс</button>
    </div>

    <!-- ЕКРАН 2: Дні тижня -->
    <div id="daysScreen" class="screen">
        <h1 id="daysTitle">Курс 🎓</h1>
        <p>Обери день тижня:</p>
        
        <button class="dayBtn" data-day="Понеділок">Понеділок</button>
        <button class="dayBtn" data-day="Вівторок">Вівторок</button>
        <button class="dayBtn" data-day="Середа">Середа</button>
        <button class="dayBtn" data-day="Четвер">Четвер</button>
        <button class="dayBtn" data-day="П'ятниця">П'ятниця</button>
        
        <button id="btnBackToCourse" class="btn-secondary">🔙 Назад до курсів</button>
    </div>

    <!-- ЕКРАН 3: Розклад -->
    <div id="scheduleScreen" class="screen">
        <h1 id="scheduleTitle">Розклад</h1>
        <div id="scheduleContent">⏳ Завантаження...</div>
        <button id="btnBackToDays" class="btn-secondary">🔙 Інший день</button>
    </div>
    
  <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const SHEET_ID = '1B-U4uPIUJk798YsXfTtwjwa-jBe1i8cJooiIPbrBrVM';
        let selectedCourse = 1;

        const courseScreen = document.getElementById('courseScreen');
        const daysScreen = document.getElementById('daysScreen');
        const scheduleScreen = document.getElementById('scheduleScreen');

        const btnCourse1 = document.getElementById('btnCourse1');
        const btnCourse2 = document.getElementById('btnCourse2');
        const btnBackToCourse = document.getElementById('btnBackToCourse');
        const btnBackToDays = document.getElementById('btnBackToDays');
        const dayButtons = document.querySelectorAll('.dayBtn');

        const daysTitle = document.getElementById('daysTitle');
        const scheduleTitle = document.getElementById('scheduleTitle');
        const scheduleContent = document.getElementById('scheduleContent');

        // Навигация
        btnCourse1.addEventListener('click', () => {
            selectedCourse = 1;
            daysTitle.innerText = "1 курс 🎓";
            courseScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        btnCourse2.addEventListener('click', () => {
            selectedCourse = 2;
            daysTitle.innerText = "2 курс 🎓";
            courseScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        btnBackToCourse.addEventListener('click', () => {
            daysScreen.classList.remove('active');
            courseScreen.classList.add('active');
        });

        btnBackToDays.addEventListener('click', () => {
            scheduleScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        // Запуск парсинга при выборе дня
        dayButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const selectedDay = e.target.getAttribute('data-day');
                daysScreen.classList.remove('active');
                scheduleScreen.classList.add('active');
                scheduleTitle.innerText = selectedDay;
                scheduleContent.innerText = "⏳ Сканую таблицю...";
                
                fetchSchedule(selectedCourse, selectedDay);
            });
        });

        async function fetchSchedule(course, day) {
            let sheetParam = '';
            // ВАЖНО: &headers=0 заставляет Google не "съедать" первую строку
            if (course === 2) {
                sheetParam = '&sheet=' + encodeURIComponent('2к 1с 26-27');
            }

            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0${sheetParam}`;
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/)[1];
                const data = JSON.parse(jsonString);
                
                let scheduleDict = {};
                let currentDay = '';
                let currentTime = '';
                const searchWord = day.toUpperCase().substring(0, 5); // "ПОНЕД"

                // УМНЫЙ СКАНЕР: идем по всем строкам без пропуска (skipRows больше не нужен)
                for (let row of data.table.rows) {
                    if (!row || !row.c) continue;

                    // Безопасно берем День (колонка 0) и Время (колонка 1)
                    let cell0 = (row.c.length > 0 && row.c[0] && row.c[0].v !== null) ? String(row.c[0].v).trim().toUpperCase() : '';
                    let cell1 = (row.c.length > 1 && row.c[1] && row.c[1].v !== null) ? String(row.c[1].v).trim() : '';

                    // Если встретили название дня, запоминаем его (аналог ffill)
                    if (['ПОНЕД', 'ВІВТО', 'СЕРЕД', 'ЧЕТВЕ', 'П\'ЯТН', 'СУБОТ'].some(d => cell0.includes(d))) {
                        currentDay = cell0;
                    }

                    // Если встретили формат времени (цифры вида 12.30), запоминаем
                    if (cell1.match(/\d{1,2}[\.,]\d{2}/)) {
                        currentTime = cell1;
                    }

                    // Если мы находимся в нужном дне и у нас есть время
                    if (currentDay.includes(searchWord) && currentTime !== '') {
                        
                        // Безопасно достаем 4 и 5 колонку (индексы 4 и 5)
                        let col4 = (row.c.length > 4 && row.c[4] && row.c[4].v !== null) ? String(row.c[4].v).trim() : '';
                        let col5 = (row.c.length > 5 && row.c[5] && row.c[5].v !== null) ? String(row.c[5].v).trim() : '';

                        let lessonPart = '';
                        if (course === 1) {
                            lessonPart = (col4 + " " + col5).trim();
                        } else {
                            lessonPart = col4.trim();
                        }

                        // Игнорируем пустые ячейки и мусор
                        if (lessonPart !== '' && lessonPart.toLowerCase() !== 'nan' && lessonPart !== 'null') {
                            if (!scheduleDict[currentTime]) scheduleDict[currentTime] = [];
                            
                            // Защита от дублей при объединенных ячейках
                            if (!scheduleDict[currentTime].includes(lessonPart)) {
                                scheduleDict[currentTime].push(lessonPart);
                            }
                        }
                    }
                }

                // Вывод на экран
                if (Object.keys(scheduleDict).length === 0) {
                    scheduleContent.innerText = `У ${day} пар немає! 🎉 (Або вони на 1 тижні)`;
                    return;
                }

                let resultText = '';
                for (let time in scheduleDict) {
                    resultText += `⏰ ${time}\n📚 ${scheduleDict[time].join('\n')}\n\n`;
                }
                scheduleContent.innerText = resultText.trim();

            } catch (error) {
                console.error(error);
                scheduleContent.innerText = "Упс, помилка при завантаженні розкладу. Можливо, Google Таблиця закрита для перегляду.";
            }
        }
    </script>
</body>
</html>
