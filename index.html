<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розклад КНУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 10px;
            text-align: center;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.2s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Головний заголовок з іконкою */
        .main-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 21px;
            font-weight: 700;
            color: #111827;
            margin: 15px 0 20px 0;
            line-height: 1.2;
        }
        
        #scheduleTitle {
            margin: 10px 0 15px 0;
            font-size: 22px;
        }

        /* --- КНОПКИ --- */
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px auto;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            width: 100%;
            max-width: 280px;
            display: block;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active:not(:disabled) { transform: scale(0.98); }
        
        /* Заблоковані кнопки (сірі та неактивні) */
        button:disabled {
            background-color: #e5e7eb !important;
            color: #9ca3af !important;
            box-shadow: none !important;
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Кольори для кнопок днів тижня */
        .btn-mon { background-color: #ffadad; color: #111827; box-shadow: 0 2px 4px rgba(255, 173, 173, 0.4); }
        .btn-tue { background-color: #ffd6a5; color: #111827; box-shadow: 0 2px 4px rgba(255, 214, 165, 0.4); }
        .btn-wed { background-color: #fdffb6; color: #111827; box-shadow: 0 2px 4px rgba(253, 255, 182, 0.4); }
        .btn-thu { background-color: #caffbf; color: #111827; box-shadow: 0 2px 4px rgba(202, 255, 191, 0.4); }
        .btn-fri { background-color: #9bf6ff; color: #111827; box-shadow: 0 2px 4px rgba(155, 246, 255, 0.4); }
        .btn-sat { background-color: #a0c4ff; color: #111827; box-shadow: 0 2px 4px rgba(160, 196, 255, 0.4); }

        /* Кнопки Назад */
        .btn-secondary { 
            background-color: #9ca3af; 
            box-shadow: 0 2px 4px rgba(156, 163, 175, 0.3); 
            margin-top: 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-secondary:active:not(:disabled) { background-color: #6b7280; }

        #scheduleContent { text-align: left; }

        /* Картки */
        .lesson-card {
            background-color: #ffffff;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .card-header {
            background-color: #f9fafb;
            text-align: center;
            padding: 6px 10px;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .lesson-number {
            font-size: 12px;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 2px;
        }
        
        .lesson-time {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .card-body { padding: 12px 14px; }

        /* Центрування назви пари */
        .lesson-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .subject-title {
            font-size: 14px;
            font-weight: 700;
            color: #111827;
            line-height: 1.3;
            text-align: center;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        
        .badge-l { background-color: #e0f2fe; color: #0369a1; }  
        .badge-pr { background-color: #dcfce7; color: #15803d; } 
        .badge-lab { background-color: #ffedd5; color: #c2410c; } 
        .badge-s { background-color: #f3e8ff; color: #7e22ce; }  

        /* Рядки з іконками */
        .info-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .room-line { font-size: 13px; font-weight: 600; color: #374151; }
        .teacher-line { font-size: 13px; color: #6b7280; }
        .other-line { font-size: 12px; color: #6b7280; margin-top: 4px; font-style: italic; text-align: center; }

        .group-label {
            font-size: 12px;
            font-weight: 700;
            color: #6366f1;
            background-color: #e0e7ff;
            padding: 4px 8px;
            border-radius: 6px;
            display: block;
            text-align: center;
            margin: 8px auto 12px auto;
            width: max-content;
        }

        /* SVG Стилі */
        .icon-svg { width: 16px; height: 16px; flex-shrink: 0; }
        .icon-clock { color: #111827; }
        .icon-room { color: #4b5563; }
        .icon-teacher { color: #9ca3af; }
        .icon-title { width: 26px; height: 26px; color: #3b82f6; }
        .icon-btn-svg { width: 18px; height: 18px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="courseScreen" class="screen active">
        <h1 class="main-title">
            <svg class="icon-title" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M18 4.933V21"/><path d="m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6"/><path d="m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11"/><path d="M6 4.933V21"/><circle cx="12" cy="9" r="2"/></svg>
            Розклад факультету соціології!
        </h1>
        <p style="color: #6b7280; margin-bottom: 24px;">Обери свій курс, щоб дізнатися розклад.</p>
        <button id="btnCourse1" class="btn-primary">1 курс</button>
        <button id="btnCourse2" class="btn-primary">2 курс</button>
        <button id="btnCourse3" class="btn-primary" disabled>3 курс</button>
        <button id="btnCourse4" class="btn-primary" disabled>4 курс</button>
    </div>

    <div id="daysScreen" class="screen">
        <h1 id="daysTitle">Курс 🎓</h1>
        <p style="color: #6b7280; margin-bottom: 20px;">Обери день тижня:</p>
        
        <button class="dayBtn btn-mon" data-day="Понеділок">Понеділок</button>
        <button class="dayBtn btn-tue" data-day="Вівторок">Вівторок</button>
        <button class="dayBtn btn-wed" data-day="Середа">Середа</button>
        <button class="dayBtn btn-thu" data-day="Четвер">Четвер</button>
        <button class="dayBtn btn-fri" data-day="П'ятниця">П'ятниця</button>
        <button class="dayBtn btn-sat" data-day="Субота" disabled>Субота</button>
        
        <button id="btnBackToCourse" class="btn-secondary">
            <svg class="icon-btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.971 4.285A2 2 0 0 1 17 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M21 20V4"/></svg>
            Назад до курсів
        </button>
    </div>

    <div id="scheduleScreen" class="screen">
        <h1 id="scheduleTitle">Розклад</h1>
        <div id="scheduleContent">⏳ Завантаження...</div>
        <button id="btnBackToDays" class="btn-secondary">
            <svg class="icon-btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.971 4.285A2 2 0 0 1 17 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M21 20V4"/></svg>
            Інший день
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let selectedCourse = "1";

        const courseScreen = document.getElementById('courseScreen');
        const daysScreen = document.getElementById('daysScreen');
        const scheduleScreen = document.getElementById('scheduleScreen');

        const btnCourse1 = document.getElementById('btnCourse1');
        const btnCourse2 = document.getElementById('btnCourse2');
        const btnBackToCourse = document.getElementById('btnBackToCourse');
        const btnBackToDays = document.getElementById('btnBackToDays');
        const dayButtons = document.querySelectorAll('.dayBtn');

        const daysTitle = document.getElementById('daysTitle');
        const scheduleTitle = document.getElementById('scheduleTitle');
        const scheduleContent = document.getElementById('scheduleContent');

        const svgClock = `<svg class="icon-svg icon-clock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
        const svgRoom = `<svg class="icon-svg icon-room" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21H2"/><path d="M10 3H7a2 2 0 00-2 2v16"/><path d="M14 12h.01"/><path d="M19 21V5a2 2 0 00-1.675-1.974l-6.163-1.013A1 1 0 0010 3v18a1 1 0 001.124.992z"/><path d="M22 21h-3"/></svg>`;
        const svgTeacher = `<svg class="icon-svg icon-teacher" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg>`;

        btnCourse1.addEventListener('click', () => {
            selectedCourse = "1";
            daysTitle.innerText = "1 курс 🎓";
            courseScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        btnCourse2.addEventListener('click', () => {
            selectedCourse = "2";
            daysTitle.innerText = "2 курс 🎓";
            courseScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        btnBackToCourse.addEventListener('click', () => {
            daysScreen.classList.remove('active');
            courseScreen.classList.add('active');
        });

        btnBackToDays.addEventListener('click', () => {
            scheduleScreen.classList.remove('active');
            daysScreen.classList.add('active');
        });

        dayButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const selectedDay = e.target.getAttribute('data-day');
                daysScreen.classList.remove('active');
                scheduleScreen.classList.add('active');
                scheduleTitle.innerText = selectedDay;
                scheduleContent.innerHTML = "<div style='text-align:center;'>⏳ Отримання даних із сервера...</div>";
                
                fetchSchedule(selectedCourse, selectedDay);
            });
        });

        function formatLessonBlock(blockText) {
            let lines = blockText.split('<br>').map(l => l.trim()).filter(l => l);
            if (lines.length === 0) return "";
            
            let subject = lines[0];
            let teacher = "";
            let room = "";
            let other = [];
            
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i];
                if (line.toLowerCase().includes('ауд')) {
                    room = line;
                } else if (line.match(/(доц\.|проф\.|асп\.|викл\.|ас\.)/i) || line.includes('👨‍🏫') || line.includes('викладач')) {
                    teacher = line;
                } else {
                    other.push(line);
                }
            }
            
            let typeBadge = "";
            let typeMatch = subject.match(/\s*\((Л\vert{}ПР\vert{}С\vert{}ЛАБ)\)/i);
            if (typeMatch) {
                let t = typeMatch[1].toUpperCase();
                let bClass = 'badge-l';
                let tName = 'Лекція';
                
                if (t === 'ПР') { bClass = 'badge-pr'; tName = 'Практика'; }
                else if (t === 'ЛАБ') { bClass = 'badge-lab'; tName = 'Лабораторна'; }
                else if (t === 'С') { bClass = 'badge-s'; tName = 'Семінар'; }
                
                typeBadge = `<div class="badge ${bClass}">${tName}</div>`;
                subject = subject.replace(typeMatch[0], '').trim();
            }
            
            subject = subject.toLowerCase();
            subject = subject.charAt(0).toUpperCase() + subject.slice(1);
            
            let html = `<div class="lesson-header">
                            <div class="subject-title">${subject}</div>
                            ${typeBadge}
                        </div>`;
                        
            if (room) {
                let cleanRoom = room.replace('🚪', '').replace('ауд.', 'ауд. ').replace(/\s+/g, ' ').trim();
                html += `<div class="info-line room-line">${svgRoom} <span>${cleanRoom}</span></div>`;
            }
            if (teacher) {
                let cleanTeacher = teacher.replace('👨‍🏫', '').trim();
                html += `<div class="info-line teacher-line">${svgTeacher} <span>${cleanTeacher}</span></div>`;
            }
            if (other.length > 0) {
                html += `<div class="other-line">${other.join('<br>')}</div>`;
            }
            
            return html;
        }

        function parseLessonText(rawText) {
            let text = rawText.replace(/\n/g, '<br>');
            
            if (text.includes('Група 1:')) {
                let parts = text.split(/(Група \d+:)/i).filter(p => p.trim() !== "");
                let html = "";
                parts.forEach(part => {
                    if (part.match(/Група \d+:/i)) {
                        html += `<div class="group-label">${part}</div>`;
                    } else {
                        html += formatLessonBlock(part);
                    }
                });
                return html;
            }
            return formatLessonBlock(text);
        }

        async function fetchSchedule(course, day) {
            const url = `https://Bohdanyof.pythonanywhere.com/api/schedule?t=${new Date().getTime()}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Помилка сервера');
                
                const data = await response.json();
                const dayKey = day.toUpperCase(); 

                if (!data[course] || !data[course][dayKey] || Object.keys(data[course][dayKey]).length === 0) {
                    scheduleContent.innerHTML = `<div style="text-align:center; font-size: 17px; color: #4b5563; margin-top: 40px;">У ${day} пар немає! 🎉</div>`;
                    return;
                }

                const daySchedule = data[course][dayKey];
                let htmlContent = '';
                
                const numberWords = ["Перша пара", "Друга пара", "Третя пара", "Четверта пара", "П'ята пара", "Шоста пара"];
                let lessonIndex = 0;
                
                for (let time in daySchedule) {
                    let parsedContent = parseLessonText(daySchedule[time]);
                    let lessonNumText = numberWords[lessonIndex] || `${lessonIndex + 1}-а пара`;
                    lessonIndex++;
                    
                    htmlContent += `
                        <div class="lesson-card">
                            <div class="card-header">
                                <div class="lesson-number">${lessonNumText}</div>
                                <div class="lesson-time">${svgClock} <span>${time}</span></div>
                            </div>
                            <div class="card-body">
                                ${parsedContent}
                            </div>
                        </div>
                    `;
                }
                
                scheduleContent.innerHTML = htmlContent;

            } catch (error) {
                console.error(error);
                scheduleContent.innerHTML = "<div style='text-align:center; color: #ef4444;'>Упс, помилка при з'єднанні з сервером. Спробуйте пізніше.</div>";
            }
        }
    </script>
</body>
</html>
